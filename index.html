     <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carpeta de Actividades</title>

    <!-- Tipografías cute -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* FONDO DE LA PÁGINA */
        body {
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            box-sizing: border-box;

            /* CAMBIA AQUÍ TU IMAGEN DE FONDO */
            background-image:
                linear-gradient(
                    rgba(252, 219, 5, 0.082),
                    rgba(251, 3, 98, 0.197)
                ),
                url("Rosa.jpg");

            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family: 'Quicksand', sans-serif;
            color: #77224a;
            text-align: center;
        }

        /* CONTENEDOR DEL TÍTULO E IMAGEN */
        .encabezado {
            max-width: 850px;
            margin: 0 auto 30px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
        }

        /* TÍTULO */
        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 52px;
            font-weight: 600;
            color: #ffafd4;
            margin: 0;
            text-shadow: 2px 3px 0px rgb(156, 7, 69);
        }

        h1::after {
            content: " ★";
            color: #f5a4c7;
        }

        /* CONTENEDOR DE ACTIVIDADES */
        ol {
            list-style: none;
            counter-reset: actividades;
            padding: 30px;
            margin: auto;
            max-width: 800px;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;

            background-color: rgba(255, 253, 245, 0.94);
            border: 3px solid #f8c6d9;
            border-radius: 30px;
            box-shadow: 0 10px 25px #e8a6b455;
        }

        /* TARJETAS */
        li {
            counter-increment: actividades;
            background-color: #fff2b8;
            border: 2px solid #f8d9a1;
            border-radius: 18px;
            transition: 0.3s ease;
        }

        /* NÚMEROS CON ESTRELLAS */
        li::before {
            content: counter(actividades) " ★";
            display: inline-block;
            margin-top: 15px;
            color: #e875a5;
            font-family: 'Fredoka', sans-serif;
            font-size: 21px;
            font-weight: 600;
        }

        /* LETRAS DE ACTIVIDADES */
        li a {
            display: block;
            padding: 10px 15px 20px;
            color: #a66c87;
            text-decoration: none;
            font-family: 'Quicksand', sans-serif;
            font-size: 17px;
            font-weight: 700;
        }

        /* ANIMACIÓN AL PASAR EL MOUSE */
        li:hover {
            background-color: #ffd4e7;
            border-color: #f3a9c9;
            transform: translateY(-6px) rotate(-1deg);
            box-shadow: 0 7px 15px #e6a6bc66;
        }

        li a:hover {
            color: #ce548a;
        }

        /* ADAPTACIÓN PARA CELULARES */
        @media (max-width: 600px) {
            .encabezado {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                font-size: 36px;
            }

            .imagen-decorativa img {
                width: 150px;
            }

            ol {
                grid-template-columns: 1fr;
                padding: 18px;
            }
        }

    </style>
</head>
