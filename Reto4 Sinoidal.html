    <Style>
/* Some HTML5 Tags
 */

aside, footer, header, nav, section {
  display: block;
}

/* Examples
 */

body {
  background-color: #b2e8ff;
  color: #0c51ff;

  
    margin: 0;
    min-height: 100vh;

    background-image: url("2.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;


    display: flex;
    justify-content: center;
    align-items: center;
}

#canvas {
    background-image: url("3.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

header {
  padding-bottom: 10px;
}

header a {
  color: #30f;
  text-decoration: none;
}

aside {
  padding-top: 6px;
}

/* Index page
 */

#index-body {
  background-color: #9497FF;
  font-family: "Vollkorn", serif;
  color: #000;
}

#index-body a {
  text-decoration: none;
  color: #0C2C9F
}

#index-body #description, #index-body #exercises {
  overflow: auto;
  max-width: 750px;
  margin: 20px auto 20px auto;
  padding-left: 15px;
  padding-bottom: 15px;
  background-color: #fff;
  border-radius: 15px;
}

#index-body h1 {
  color: #b30300;
}

#index-body h1 a {
  text-decoration: underline;
  color: #b30300;
}

#index-body li h2, #index-body li h3, #index-body li h4 {
  color: #000;
}

#index-body li h3 {
  margin-bottom: 0px;
}

#description ul {
  margin: 0;
  padding: 4px 20px 10px 20px;
}

#description iframe {
  float: center;
  margin: 15px 0 15px 15px;
}

#exercises ol {
  margin: 0 20px 10px 0;
  padding: 0;
  list-style-type: none;
}

#exercises ol li {
  padding-top: 5px;
}

#exercises ol ol ol {
  padding-left: 60px;
  list-style-type: decimal-leading-zero;
}

#exercises ol ol ol li img, #exercises ol ol li img {
  margin-left: 4px;
  margin-bottom: -10;
}

#exercises h2 {
  margin: 10px 0 0 0;
}


    </Style>


  </head>  
  <body>
    
    <canvas id="canvas" width="800" height="600"></canvas>
    
    <script src="utils3.js"></script>
    <script src="PelotaPelotita.js"></script>

    <script>
    window.onload = function () {

      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          ball = new Pelota(),
          angle = 0,
          centerY = canvas.height / 2,
          range = 150,
          xspeed = 2,
          yspeed = 0.05,
          xpos = 0,
          ypos = centerY;

      (function drawFrame () {

        window.requestAnimationFrame(drawFrame);

        context.clearRect(0, 0, canvas.width, canvas.height);

        // Movimiento horizontal
        xpos += xspeed;

        // Hacer que rebote en los extremos
        if (xpos >= canvas.width || xpos <= 0) {
          xspeed *= -1;
        }

        // Movimiento de onda
        angle += yspeed;
        ypos = centerY + Math.sin(angle) * range;

        // Posición de la pelota
        ball.x = xpos;
        ball.y = ypos;


        //tama;o de imagen
        ball.scaleX = ball.scaleY = 0.2;

        // Dibujar la pelota
        ball.draw(context);

      }());

    };
    </script>
  </body>
