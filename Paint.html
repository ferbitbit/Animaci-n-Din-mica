<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <title>♡ My Paint ♡</title>
    <style>
      body {
        text-align: center;
        margin-top: 20px;
        background-image: url("Estrellas.jpg");
        background-size: auto;
        font-family: "Trebuchet MS", sans-serif;
        color: #b56b91;
      }

      h1 {
        color: #bc7a9e;
        font-size: 35px;
        margin-bottom: 5px;
      }

      p {
        color: #bc7a9e;
      }

      canvas {
        background-color: white;
        border: 4px solid #f4c6dc;
        border-radius: 20px;
        box-shadow: 0 5px 15px #e9bfd2;
        cursor: crosshair;
        max-width: 95%;
        height: auto;
      }

      .colores {
        width: 95%;
        max-width: 900px;
        margin: 20px auto;
        padding: 15px;
        background-color: #ffffff;
        border: 2px solid #f6d5e5;
        border-radius: 25px;
        box-sizing: border-box;
      }

      .colores button {
        width: 38px;
        height: 38px;
        margin: 5px;
        border: 3px solid white;
        outline: 2px solid transparent;
        cursor: pointer;
        border-radius: 50%;
        transition: transform 0.2s, outline 0.2s;
        vertical-align: middle;
      }

      .colores button:hover {
        transform: scale(1.15);
      }

      .colores button.selected {
        outline: 2px solid #d47ba5;
        transform: scale(1.12);
      }

      #otros {
        margin: 10px;
      }

      #otros button {
        padding: 12px 25px;
        background: #e9a9c8;
        border: 2px solid #ffffff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
        border-radius: 20px;
        box-shadow: 0 3px 7px #edc5d9;
        transition: 0.2s;
      }

      #otros button:hover {
        background: #d88db4;
        transform: translateY(-2px);
      }

      aside {
        margin: 15px;
        color: #b88ba4;
        font-size: 15px;
      }
    

/* Distribución general */
.paint {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin: 20px auto;
  width: 98%;
}

/* Barras laterales de colores */
.colores {
  width: 90px;
  min-width: 90px;
  height: auto;
  padding: 12px 5px;
  box-sizing: border-box;
  background: #fff;
  border: 2px solid #f6d5e5;
  border-radius: 25px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

/* Botones circulares */
.colores button {
  width: 35px;
  height: 35px;
  min-width: 35px;
  margin: 3px;
  border: 3px solid white;
  outline: 1px solid #f3d5e4;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s;
}

.colores button:hover {
  transform: scale(1.15);
}

/* Color seleccionado */
.colores button.selected {
  outline: 3px solid #d47ba5;
}

/* Lienzo central */
#canvas {
  background-color: white;
  border: 4px solid #f4c6dc;
  border-radius: 20px;
  box-shadow: 0 5px 15px #e9bfd2;
  max-width: 100%;
  height: auto;
}

/* Títulos de las paletas */
.titulo-color {
  font-size: 12px;
  font-weight: bold;
  color: #c16e96;
  margin-bottom: 5px;
}

/* Adaptación para pantallas pequeñas */
@media (max-width: 700px) {
  .paint {
    gap: 5px;
  }

  .colores {
    width: 55px;
    min-width: 55px;
    padding: 8px 2px;
  }

  .colores button {
    width: 27px;
    height: 27px;
    min-width: 27px;
  }
} 

/* Sombras para los textos */
h1, h2, h3, p, aside, label {
    text-shadow: 2px 2px 4px rgba(100, 60, 90, 0.35);
}

/* Títulos más definidos */
h1, h2, h3 {
    color: #b88ba4;
    text-shadow: 2px 3px 5px #f3d5e4;
}

/* Textos de los botones */
button {
    text-shadow: 1px 2px 3px rgba(60, 40, 60, 0.35);
}
    </style>
  </head>

  <body>
    <h1> MyPaint ☆</h1>
    <p>✿ Draw your little world ✿</p>

    
<div id="otros">
  <button id="clear" type="button"> Borrar todo ☑</button>
</div>

<div class="paint">

  <div class="colores">
    <div class="titulo-color">♡ Pastel</div>
    <button type="button" value="#ffc2d1" style="background:#ffc2d1"></button>
    <button type="button" value="#cdb4db" style="background:#cdb4db"></button>
    <button type="button" value="#bde0fe" style="background:#bde0fe"></button>
    <button type="button" value="#b7e4c7" style="background:#b7e4c7"></button>
    <button type="button" value="#fdffb6" style="background:#fdffb6"></button>
    <button type="button" value="#ffd6a5" style="background:#ffd6a5"></button>
    <button type="button" value="#ffadad" style="background:#ffadad"></button>
    <button type="button" value="#e9edc9" style="background:#e9edc9"></button>
  </div>

  <canvas id="canvas" width="1000" height="700"></canvas>

  <div class="colores">
    <div class="titulo-color">♡ Normal</div>
    <button type="button" value="#000000" style="background:#000000"></button>
    <button type="button" value="#ffffff" style="background:#ffffff"></button>
    <button type="button" value="#ff0000" style="background:#ff0000"></button>
    <button type="button" value="#e75480" style="background:#e75480"></button>
    <button type="button" value="#a78bfa" style="background:#a78bfa"></button>
    <button type="button" value="#468faf" style="background:#468faf"></button>
    <button type="button" value="#40916c" style="background:#40916c"></button>
    <button type="button" value="#ffb703" style="background:#ffb703"></button>
    <button type="button" value="#f4a261" style="background:#f4a261"></button>
    <button type="button" value="#9c6644" style="background:#9c6644"></button>
  </div>

</div>
  <aside>✿ Haz clic y arrastra para dibujar ✿</aside>

    <script src="utils2.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          mouse = utils.captureMouse(canvas);

      // Configuración del pincel redondo
      context.lineWidth = 8;
      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = '#ff8fab';

      var dibujando = false;

      canvas.addEventListener('mousedown', function () {
        dibujando = true;
        context.beginPath();
        context.moveTo(mouse.x, mouse.y);
        canvas.addEventListener('mousemove', onMouseMove, false);
      }, false);

      canvas.addEventListener('mouseup', function () {
        dibujando = false;
        canvas.removeEventListener('mousemove', onMouseMove, false);
      }, false);

      canvas.addEventListener('mouseleave', function () {
        dibujando = false;
        canvas.removeEventListener('mousemove', onMouseMove, false);
      }, false);

      function onMouseMove () {
        if (dibujando) {
          context.lineTo(mouse.x, mouse.y);
          context.stroke();
        }
      }

      // Cambiar color de trazo
      var colores = document.getElementsByClassName('colores')[0];
      var botones = colores.getElementsByTagName('button');

      // Seleccionar el rosa inicialmente
      botones[2].classList.add('selected');
      
      var paletas = document.querySelectorAll('.colores');

      paletas.forEach(function(paleta) {
      paleta.addEventListener('click', function(event) {
        if (event.target.tagName === 'BUTTON' && event.target.value) {
            context.strokeStyle = event.target.value;

            document.querySelectorAll('.colores button').forEach(function(boton) {
                boton.classList.remove('selected');
            });

            event.target.classList.add('selected');
        }
    });
});
      // Borrar todo
      var clearButton = document.getElementById('clear');

      clearButton.addEventListener('click', function() {
        context.clearRect(0, 0, canvas.width, canvas.height);
      });
    };
    </script>
  </body>
</html>
