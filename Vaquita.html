<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Vaquita</title>
   <style>
       canvas{
           border: 1px solid #19c050;
           background-color: rgb(138, 222, 255);
       }
   </style>
   <script>
       var x=Math.random() * 800;
       var y=Math.random() * 600;
       var dx=4;
       function animate(){
           requestAnimationFrame(animate);
           var canvas = document.getElementById("micanvas");
           var context = canvas.getContext("2d");
           context.clearRect(0, 0, innerWidth, innerHeight);
           //console.log('animando');
                      // OREJAS AMARILLAS
           context.fillStyle='rgba(255,255,0,1)';
           context.fillRect(x+120,y,50,50);
           context.fillRect(x+120,y+50,50,50);
           context.fillRect(x+370,y,50,50);
           context.fillRect(x+370,y+50,50,50);

           // CABEZA CAFÉ
           context.fillStyle='rgba(112,64,15,1)';
           context.fillRect(x+170,y+50,50,50);
           context.fillRect(x+220,y+50,50,50);
           context.fillRect(x+270,y+50,50,50);

           context.fillRect(x,y+100,50,50);
           context.fillRect(x+50,y+100,50,50);
           context.fillRect(x+170,y+100,50,50);
           context.fillRect(x+220,y+100,50,50);
           context.fillRect(x+420,y+100,50,50);
           context.fillRect(x+470,y+100,50,50);
           context.fillRect(x+520,y+100,50,50);

           context.fillRect(x+170,y+150,50,50);
           context.fillRect(x+420,y+150,50,50);

           // CARA BLANCA
           context.fillStyle='rgba(255,255,255,1)';
           context.fillRect(x+120,y+50,50,50);

           context.fillRect(x+100,y+100,50,50);
           context.fillRect(x+150,y+100,50,50);

           context.fillRect(x+50,y+150,50,50);
           context.fillRect(x+100,y+150,50,50);
           context.fillRect(x+150,y+150,50,50);

           context.fillRect(x+270,y+150,50,50);
           context.fillRect(x+320,y+150,50,50);
           context.fillRect(x+370,y+150,50,50);

           context.fillRect(x+100,y+200,50,50);
           context.fillRect(x+200,y+200,50,50);
           context.fillRect(x+250,y+200,50,50);
           context.fillRect(x+350,y+200,50,50);

           // OJOS
           context.fillStyle='rgba(0,0,0,1)';
           context.fillRect(x+150,y+200,50,50);
           context.fillRect(x+300,y+200,50,50);

           // CUERPO
           context.fillStyle='rgba(150,101,45,1)';
           context.fillRect(x+50,y+250,50,50);
           context.fillRect(x+100,y+250,50,50);
           context.fillRect(x+150,y+250,50,50);
           context.fillRect(x+200,y+250,50,50);
           context.fillRect(x+250,y+250,50,50);
           context.fillRect(x+300,y+250,50,50);
           context.fillRect(x+350,y+250,50,50);
           context.fillRect(x+400,y+250,50,50);
           context.fillRect(x+450,y+250,50,50);

           context.fillRect(x+50,y+300,50,50);
           context.fillRect(x+100,y+300,50,50);
           context.fillRect(x+150,y+300,50,50);
           context.fillRect(x+200,y+300,50,50);
           context.fillRect(x+250,y+300,50,50);
           context.fillRect(x+300,y+300,50,50);
           context.fillRect(x+350,y+300,50,50);
           context.fillRect(x+400,y+300,50,50);
           context.fillRect(x+450,y+300,50,50);

           context.fillRect(x+100,y+350,50,50);
           context.fillRect(x+150,y+350,50,50);
           context.fillRect(x+200,y+350,50,50);
           context.fillRect(x+250,y+350,50,50);
           context.fillRect(x+300,y+350,50,50);
           context.fillRect(x+350,y+350,50,50);
           context.fillRect(x+400,y+350,50,50);

           // MANCHAS DEL CUERPO
           context.fillStyle='rgba(112,64,15,1)';
           context.fillRect(x+150,y+300,50,50);
           context.fillRect(x+350,y+300,50,50);
           
            if (x > 800 || x < 0){
                dx= -dx;
            }
           x+=dx;
           
       }
       animate();
   </script>
   </head>
 <body>
    <canvas id="micanvas" width="800" height="600"></canvas>
 </body>
</html>
